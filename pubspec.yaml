name: liquid_ai_leap
description: >-
  A Flutter plugin wrapper for the Liquid AI LEAP SDK. Provides on-device AI 
  inference capabilities using Liquid Foundation Models (LFM) on iOS and Android.
version: 0.3.0
homepage: https://github.com/colymba/flutter_liquid_ai_leap
repository: https://github.com/colymba/flutter_liquid_ai_leap
issue_tracker: https://github.com/colymba/flutter_liquid_ai_leap/issues
documentation: https://github.com/colymba/flutter_liquid_ai_leap/blob/main/README.md

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ai.liquid.leap.flutter
        pluginClass: LiquidAiLeapPlugin
      ios:
        pluginClass: LiquidAiLeapPlugin

# Topics (5 max) for pub.dev discoverability
topics:
  - liquid-ai
  - gguf
  - genai
  - liquid-ai-leap
  - edge-inference
